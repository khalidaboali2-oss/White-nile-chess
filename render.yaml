services:
  - type: web
    name: white-nile-chess
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: ALLOWED_ORIGINS
        value: https://white-nile-chess.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: white-nile-chess-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: white-nile-chess-redis
          property: connectionString

  - type: keyvalue
    name: white-nile-chess-redis
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: Render internal connectivity

databases:
  - name: white-nile-chess-db
    plan: free
    region: frankfurt
